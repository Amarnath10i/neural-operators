# gno_airfoil.yaml - GNO on Airfoil (unstructured mesh)
model:
  type: gno
  in_channels: 3
  out_channels: 2
  hidden_channels: 128
  n_layers: 6
  modes: 16
  edge_attr_dim: 1
  lifting_channels: 256
  projection_channels: 256

data:
  pde_type: airfoil
  n_samples: 1000
  mesh_type: unstructured
  resolution: variable

training:
  batch_size: 8
  epochs: 300
  optimizer: adamw
  lr: 5e-4
  weight_decay: 1e-4
  scheduler: cosine_warmup
  warmup_epochs: 15
  grad_accum_steps: 4
  use_amp: true
  early_stopping_patience: 30

loss:
  type: mse
