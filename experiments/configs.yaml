# Neural Operators - Experiment Configurations

Pre-built YAML configurations for reproducible experiments.

```yaml
# fno_navier_stokes.yaml - FNO on 2D Navier-Stokes
model:
  type: fno2d
  modes: 16
  width: 64
  n_layers: 4
  in_channels: 3  # vorticity, forcing, time
  out_channels: 1
  spectral_conv_type: standard
  dropout: 0.0

data:
  pde_type: navier_stokes
  n_samples: 2000
  resolution: 64
  nu_range: [1e-4, 1e-3]
  T: 50.0
  dt: 1e-3
  save_every: 1000
  forcing_type: kolmogorov
  train_ratio: 0.8
  val_ratio: 0.1

training:
  batch_size: 32
  epochs: 500
  optimizer: adamw
  lr: 1e-3
  weight_decay: 1e-4
  scheduler: cosine_warmup
  warmup_epochs: 10
  grad_accum_steps: 1
  max_grad_norm: 1.0
  use_amp: true
  early_stopping_patience: 50
  early_stopping_metric: val_loss

loss:
  type: spectral
  weight_low: 1.0
  weight_high: 0.5
  modes: 16

evaluation:
  zero_shot_superres: true
  target_resolutions: [128, 256, 512]
  domain_adaptation: false

logging:
  use_wandb: true
  wandb_project: neural-operators
  wandb_entity: null
  use_tensorboard: true
  log_dir: logs/fno_ns
  checkpoint_dir: checkpoints/fno_ns
  save_every: 10
```

