  target_resolutions: [256, 512, 1024]
  domain_adaptation: true
```

```yaml
# deeponet_darcy.yaml - DeepONet on Darcy Flow
model:
  type: deeponet
  branch_input_dim: 7225  # 85x85 flattened
  trunk_input_dim: 2      # (x, y) coordinates
  output_dim: 1
  branch_hidden: [256, 256, 256]
  trunk_hidden: [256, 256, 256]
  p: 256
  activation: gelu

data:
  pde_type: darcy
  n_samples: 2000
  resolution: 85
  permeability_range: [0.1, 10.0]
  correlation_length: 0.1

training:
  batch_size: 64
  epochs: 500
  optimizer: adamw
  lr: 1e-3
  weight_decay: 1e-4
  scheduler: cosine_warmup
  warmup_epochs: 10
  use_amp: true
  early_stopping_patience: 30

loss:
  type: mse

evaluation:
  zero_shot_superres: true
  target_resolutions: [171, 341]
  domain_adaptation: true
```

```yaml
# superresolution.yaml - Zero-shot super-resolution
model:
  type: fno2d
  modes: 16
  width: 64
  n_layers: 4
  in_channels: 3
  out_channels: 1

data:
  train_resolution: 64
  test_resolutions: [128, 256, 512, 1024]
  n_samples: 2000
  pde_type: navier_stokes
  nu_range: [1e-4, 1e-3]
  T: 50.0
  dt: 1e-3

training:
  batch_size: 32
  epochs: 500
  optimizer: adamw
  lr: 1e-3
  weight_decay: 1e-4
  scheduler: cosine_warmup
  warmup_epochs: 10
  use_amp: true

evaluation:
  metrics: [relative_l2, spectral, energy, enstrophy]
  save_predictions: true
```

```yaml
# domain_adaptation.yaml - Few-shot domain adaptation
model:
  type: fno2d
  modes: 16
  width: 64
  n_layers: 4

data:
  source_pde: darcy
  target_pde: darcy
  source_permeability_range: [0.1, 10.0]
  target_permeability_range: [0.01, 100.0]
  source_correlation_length: 0.1
  target_correlation_length: 0.2
  n_source_samples: 2000
  n_target_shots: [1, 5, 10, 50, 100]

training:
  pretrain_epochs: 300
  finetune_epochs: 200
  optimizer: adamw
  lr: 1e-3
  finetune_lr: 1e-4
  weight_decay: 1e-4
  scheduler: cosine_warmup

evaluation:
  metrics: [relative_l2]
  few_shot_eval: true
```

```yaml
# theory_verification.yaml - Theory verification experiments
model:
  type: fno2d
  modes: 16
  width: 64
  n_layers: 4

data:
  pde_type: navier_stokes
  n_samples: 1000
  resolution: 64

theory:
  enabled: true
  verify_generalization: true
  verify_spectral_convergence: true
  verify_stability: true
  verify_discretization_invariance: true
  delta: 0.05
  rademacher_samples: 100
  lipschitz_pairs: 1000
  perturbation_magnitudes: [1e-4, 1e-3, 1e-2, 1e-1]
  resolutions: [32, 64, 128, 256]
  modes_list: [4, 8, 12, 16, 20, 24]
  input_smoothness: 2.0
```

